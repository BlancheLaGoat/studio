name: Build Windows

# Un tag vX.Y.Z construit les trois applis et publie chacune dans son dépôt :
#   Platine   -> BlancheLaGoat/platine
#   Pellicule -> BlancheLaGoat/pellicule
#   Studio    -> BlancheLaGoat/studio
# Secrets nécessaires dans CE dépôt : EVS_ACCOUNT, EVS_PASSWD (signature Widevine)
# et RELEASE_TOKEN (jeton GitHub qui a le droit d'écrire dans les trois dépôts).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [platine, pellicule, studio]
    env:
      EVS_ACCOUNT: ${{ secrets.EVS_ACCOUNT }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
      SKIP_EVS: ${{ secrets.EVS_ACCOUNT == '' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Installer castlabs-evs
        run: pip install --upgrade castlabs-evs

      - name: Connexion EVS (signature VMP)
        if: ${{ env.EVS_ACCOUNT != '' }}
        run: python -m castlabs_evs.account reauth -A "$env:EVS_ACCOUNT" -P "$env:EVS_PASSWD"

      - run: npm ci || npm install

      - name: Construire ${{ matrix.edition }}
        run: node scripts/build.js ${{ matrix.edition }}

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.edition }}-Setup
          path: |
            dist/${{ matrix.edition }}/*.exe
            dist/${{ matrix.edition }}/latest.yml

      - name: Release dans BlancheLaGoat/${{ matrix.edition }}
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          repository: BlancheLaGoat/${{ matrix.edition }}
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            dist/${{ matrix.edition }}/*.exe
            dist/${{ matrix.edition }}/*.exe.blockmap
            dist/${{ matrix.edition }}/latest.yml
