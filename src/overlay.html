<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>{{APP}} — overlay</title>
<!--
  Overlay OBS de {{APP}}. Dans OBS : Sources → + → Navigateur
    URL : http://127.0.0.1:4848/overlay
    Largeur 620, hauteur 150, cocher « Actualiser le navigateur quand la scène devient active ».
  Options à ajouter à l'URL :
    ?style=carte     autre présentation : nom de la plateforme en haut, barre en bas de la carte
    ?pause=show      reste affiché quand la musique est en pause (par défaut il se cache)
    ?accent=00e5ff   force une couleur (sinon celle de la plateforme)
    ?compact=1       version plus petite, sans pochette
    ?align=right     colle la carte à droite de la source
-->
<style>
  :root {
    --accent: #33ffee;
    --card: rgba(58, 58, 62, .92);
    --text: #ffffff;
    --muted: #a9b3c7;
    --track: rgba(255,255,255,.16);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; overflow: hidden; height: 100%; }
  body {
    font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    display: flex; align-items: flex-end; padding: 10px;
  }
  body.right { justify-content: flex-end; }

  .card {
    display: flex; align-items: center; gap: 16px;
    background: var(--card);
    border-radius: 16px;
    padding: 14px 20px 14px 14px;
    width: 600px; max-width: 100%;
    position: relative; overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    transition: opacity .5s ease, transform .5s ease;
  }
  .card.hidden { opacity: 0; transform: translateY(16px); }
  .art {
    width: 96px; height: 96px; flex: none; border-radius: 10px;
    background: rgba(255,255,255,.06) center/cover no-repeat;
  }
  .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .src { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
  .title { font-size: 21px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist { font-size: 16px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* progression sous l'artiste (style par défaut) */
  .progress { margin-top: 10px; }
  .progress .track { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .progress .fill {
    height: 100%; width: 0; border-radius: 3px;
    background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 70%, #4aa8ff));
    transition: width 1s linear;
  }
  .progress .time { text-align: right; font-size: 13px; color: rgba(255,255,255,.75); margin-top: 6px; font-variant-numeric: tabular-nums; }

  /* égaliseur à droite */
  .eq { flex: none; display: flex; align-items: flex-end; gap: 5px; height: 40px; align-self: center; padding-left: 6px; }
  .eq b { width: 6px; border-radius: 3px; background: var(--accent); }
  .eq b:nth-child(1) { height: 30%; } .eq b:nth-child(2) { height: 55%; }
  .eq b:nth-child(3) { height: 80%; } .eq b:nth-child(4) { height: 100%; }
  .playing .eq b { animation: eq 1.1s ease-in-out infinite; }
  .playing .eq b:nth-child(1) { animation-delay: -.2s; }
  .playing .eq b:nth-child(2) { animation-delay: -.6s; }
  .playing .eq b:nth-child(3) { animation-delay: -.9s; }
  .playing .eq b:nth-child(4) { animation-delay: -.4s; }
  .card:not(.playing) .eq b { opacity: .45; }
  @keyframes eq { 0%, 100% { transform: scaleY(.45); } 50% { transform: scaleY(1); } }
  .eq b { transform-origin: bottom; }

  /* petite barre en bas de la carte (style « carte ») */
  .bottombar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.08); display: none; }
  .bottombar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 1s linear; }

  /* --- style « barre » (défaut) : comme l'ancien overlay --- */
  body:not(.carte) .src { display: none; }

  /* --- style « carte » --- */
  body.carte { --card: rgba(14, 14, 18, .86); --muted: #a2a2ad; }
  body.carte .card { width: auto; padding: 12px 18px 14px 12px; border: 1px solid rgba(255,255,255,.08); }
  body.carte .progress, body.carte .eq { display: none; }
  body.carte .bottombar { display: block; }

  /* --- compact --- */
  body.compact .art { display: none; }
  body.compact .card { padding: 10px 16px; border-radius: 12px; width: 420px; }
  body.compact .title { font-size: 16px; }
  body.compact .artist { font-size: 13px; }
  body.compact .progress { margin-top: 6px; }
  body.compact .eq { height: 28px; }
</style>
</head>
<body>
  <div class="card hidden" id="card">
    <div class="art" id="art"></div>
    <div class="info">
      <div class="src" id="src">{{APP}}</div>
      <div class="title" id="title"></div>
      <div class="artist" id="artist"></div>
      <div class="progress">
        <div class="track"><div class="fill" id="fill"></div></div>
        <div class="time" id="time"></div>
      </div>
    </div>
    <div class="eq"><b></b><b></b><b></b><b></b></div>
    <div class="bottombar"><i id="bar"></i></div>
  </div>
<script>
  const q = new URLSearchParams(location.search);
  const keepPaused = q.get('pause') === 'show';
  if (q.get('style') === 'carte') document.body.classList.add('carte');
  if (q.get('compact') === '1') document.body.classList.add('compact');
  if (q.get('align') === 'right') document.body.classList.add('right');
  const forced = q.get('accent');
  if (forced) document.documentElement.style.setProperty('--accent', '#' + forced.replace('#', ''));

  const $ = id => document.getElementById(id);
  const fmt = s => { s = Math.max(0, Math.round(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  let lastArt = null, hideTimer = null, s = {}, receivedAt = Date.now();

  function render(next) {
    s = next || {};
    receivedAt = Date.now();
    const card = $('card');
    if (!forced && s.platform) document.documentElement.style.setProperty('--accent', s.platform.accent);
    $('src').textContent = s.platform ? s.platform.name : '{{APP}}';
    $('title').textContent = s.title || '';
    $('artist').textContent = s.artist || '';
    card.classList.toggle('playing', !!s.playing);

    if (s.art !== lastArt) {
      lastArt = s.art;
      $('art').style.backgroundImage = s.art && /^https?:/.test(s.art) ? `url("${s.art}")` : '';
    }

    // en pause : on cache après 3 s (sans relancer le compte à rebours à chaque message)
    const visible = s.title && (s.playing || keepPaused);
    if (visible) { clearTimeout(hideTimer); hideTimer = null; card.classList.remove('hidden'); }
    else if (!hideTimer && !card.classList.contains('hidden')) {
      hideTimer = setTimeout(() => { card.classList.add('hidden'); hideTimer = null; }, s.title ? 3000 : 0);
    }
    tick();
  }

  // la progression avance toute seule entre deux messages
  function tick() {
    if (!s.duration) {
      $('fill').style.width = $('bar').style.width = '0';
      $('time').textContent = '';
      return;
    }
    const extra = s.playing ? (Date.now() - receivedAt) / 1000 : 0;
    const pos = Math.min(s.duration, (s.position || 0) + extra);
    const pct = (pos / s.duration * 100) + '%';
    $('fill').style.width = pct;
    $('bar').style.width = pct;
    $('time').textContent = '-' + fmt(s.duration - pos);
  }
  setInterval(tick, 1000);

  // flux en direct depuis l'appli ; se reconnecte tout seul si elle redémarre
  function listen() {
    const es = new EventSource('/events');
    es.onmessage = e => { try { render(JSON.parse(e.data)); } catch {} };
    es.onerror = () => { es.close(); render({}); setTimeout(listen, 3000); };
  }
  listen();
</script>
</body>
</html>
