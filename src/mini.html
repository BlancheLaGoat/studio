<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src https: http: data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>mini</title>
<style>
  :root {
    --bg: #111114;
    --line: #26262c;
    --text: #f2f2f4;
    --muted: #8f8f99;
    --accent: #33ffee;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    -webkit-app-region: drag;   /* on déplace la fenêtre en la tirant n'importe où */
    user-select: none;
    border: 1px solid var(--line);
    position: relative;
  }
  .wrap { display: flex; align-items: center; gap: 12px; padding: 12px 12px 16px; height: 100%; }
  .art {
    width: 80px; height: 80px; flex: none; border-radius: 10px;
    background: #1c1c22 center/cover no-repeat;
    display: grid; place-items: center; color: var(--muted);
    box-shadow: 0 4px 18px rgba(0,0,0,.45);
  }
  .art svg { opacity: .5; }
  .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .head { display: flex; align-items: baseline; gap: 8px; padding-right: 52px; }
  .src { font-size: 11px; color: var(--accent); opacity: .9; white-space: nowrap; }
  .time { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .controls { display: flex; align-items: center; gap: 4px; margin-top: 4px; }
  button {
    all: unset;
    -webkit-app-region: no-drag;
    cursor: pointer; display: grid; place-items: center;
    width: 32px; height: 32px; border-radius: 50%; color: var(--text);
    transition: background .12s, transform .08s;
  }
  button:hover { background: #ffffff14; }
  button:active { transform: scale(.92); }
  button[aria-disabled="true"] { opacity: .3; cursor: default; }
  button.play { width: 38px; height: 38px; background: var(--accent); color: #0b0b0d; }
  button.play:hover { background: color-mix(in srgb, var(--accent) 85%, white); }

  .vol { margin-left: auto; display: flex; align-items: center; gap: 2px; -webkit-app-region: no-drag; }
  .vol button { width: 28px; height: 28px; color: var(--muted); }
  .vol button:hover { color: var(--text); }
  .vol.off { opacity: .35; pointer-events: none; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 74px; height: 16px; background: transparent; cursor: pointer;
    -webkit-app-region: no-drag;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 4px; border-radius: 2px;
    background: linear-gradient(to right, var(--accent) var(--v, 100%), #ffffff22 var(--v, 100%));
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; margin-top: -4px; background: var(--text);
  }

  .top { position: absolute; top: 4px; right: 4px; display: flex; }
  .top button { width: 24px; height: 24px; color: var(--muted); }
  .top button:hover { color: var(--text); }

  /* barre de progression : cliquer pour avancer dans le morceau */
  .seek {
    position: absolute; left: 0; right: 0; bottom: 0; height: 10px;
    display: flex; align-items: flex-end; cursor: pointer; -webkit-app-region: no-drag;
  }
  .seek .track { width: 100%; height: 3px; background: #ffffff10; transition: height .12s; position: relative; }
  .seek:hover .track { height: 6px; }
  .seek i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .7s linear; }
  .seek.dragging i { transition: none; }
  .seek.off { cursor: default; pointer-events: none; }
  .tip {
    position: absolute; bottom: 12px; transform: translateX(-50%);
    font-size: 11px; background: #000c; color: var(--text); padding: 1px 6px; border-radius: 4px;
    font-variant-numeric: tabular-nums; pointer-events: none; display: none;
  }
  .seek:hover .tip { display: block; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="art" id="art">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg>
    </div>
    <div class="info">
      <div class="head"><span class="src" id="src"></span><span class="time" id="time"></span></div>
      <div class="title" id="title">Rien en lecture</div>
      <div class="artist" id="artist">Lance un morceau</div>
      <div class="controls">
        <button id="prev" title="Précédent">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
        </button>
        <button id="toggle" class="play" title="Lecture / pause">
          <svg id="ico" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button id="next" title="Suivant">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5l11 7-11 7z"/></svg>
        </button>
        <div class="vol off" id="vol">
          <button id="mute" title="Couper / remettre le son">
            <svg id="volico" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <input type="range" id="volume" min="0" max="100" value="100" title="Volume">
        </div>
      </div>
    </div>
  </div>
  <div class="top">
    <button id="expand" title="Revenir à la grande fenêtre">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>
    </button>
    <button id="close" title="Fermer le mini-lecteur (la musique continue)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="seek off" id="seek"><div class="track"><i id="bar"></i></div><span class="tip" id="tip"></span></div>

<script>
  const APP = new URLSearchParams(location.search).get('app') || 'Studio';
  document.title = document.title + ' — ' + APP;
  const $ = id => document.getElementById(id);
  const PLAY = '<path d="M8 5v14l11-7z"/>';
  const PAUSE = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
  const VOL_ON = '<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>';
  const VOL_OFF = '<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>';
  const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const send = a => window.mini.action(a);
  let lastArt = null, s = {}, volTouchedAt = 0, beforeMute = 1;

  for (const id of ['prev', 'next', 'toggle', 'expand', 'close']) {
    $(id).addEventListener('click', () => send(id === 'prev' ? 'previoustrack' : id === 'next' ? 'nexttrack' : id));
  }

  // --- avancer dans le morceau ---
  const seek = $('seek');
  const pctAt = e => { const r = seek.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); };
  seek.addEventListener('mousemove', e => {
    if (!s.duration) return;
    const p = pctAt(e);
    $('tip').textContent = fmt(p * s.duration);
    $('tip').style.left = (p * 100) + '%';
  });
  seek.addEventListener('click', e => {
    if (!s.duration) return;
    const p = pctAt(e);
    seek.classList.add('dragging');
    $('bar').style.width = (p * 100) + '%';
    send({ seek: p * s.duration });
    setTimeout(() => seek.classList.remove('dragging'), 300);
  });

  // --- volume ---
  const vol = $('volume');
  const paintVol = v => { vol.style.setProperty('--v', v + '%'); $('volico').innerHTML = v == 0 ? VOL_OFF : VOL_ON; };
  vol.addEventListener('input', () => { volTouchedAt = Date.now(); paintVol(vol.value); send({ volume: vol.value / 100 }); });
  $('mute').addEventListener('click', () => {
    volTouchedAt = Date.now();
    if (+vol.value > 0) { beforeMute = vol.value / 100; vol.value = 0; } else vol.value = Math.round((beforeMute || 1) * 100);
    paintVol(vol.value);
    send({ volume: vol.value / 100 });
  });
  vol.addEventListener('wheel', e => {
    e.preventDefault();
    vol.value = Math.max(0, Math.min(100, +vol.value + (e.deltaY < 0 ? 5 : -5)));
    vol.dispatchEvent(new Event('input'));
  }, { passive: false });

  document.getElementById('src').textContent = APP;
  window.mini.onState(next => {
    s = next || {};
    if (s.platform) {
      document.documentElement.style.setProperty('--accent', s.platform.accent);
      $('src').textContent = s.platform.name;
    }
    $('title').textContent = s.title || 'Rien en lecture';
    $('artist').textContent = s.artist || (s.title ? '' : 'Lance un morceau');
    document.title = s.title ? `${s.title} — ${s.artist || ''}` : `${APP} — mini`;

    if (s.art !== lastArt) {
      lastArt = s.art;
      const art = $('art');
      const showIcon = on => { if (art.firstElementChild) art.firstElementChild.style.display = on ? '' : 'none'; };
      if (s.art) {
        const img = new Image();
        img.onload = () => { art.style.backgroundImage = `url("${s.art}")`; showIcon(false); };
        img.onerror = () => { art.style.backgroundImage = ''; showIcon(true); };
        img.src = s.art;
      } else {
        art.style.backgroundImage = '';
        showIcon(true);
      }
    }

    $('ico').innerHTML = s.playing ? PAUSE : PLAY;
    const can = s.can || {};
    $('prev').setAttribute('aria-disabled', can.prev === false ? 'true' : 'false');
    $('next').setAttribute('aria-disabled', can.next === false ? 'true' : 'false');

    seek.classList.toggle('off', !(s.duration && can.seek));
    if (s.duration) {
      if (!seek.classList.contains('dragging')) $('bar').style.width = Math.min(100, (s.position / s.duration) * 100) + '%';
      $('time').textContent = fmt(s.position) + ' / ' + fmt(s.duration);
    } else {
      $('bar').style.width = '0';
      $('time').textContent = '';
    }

    $('vol').classList.toggle('off', !can.volume);
    // on ne réécrase pas le curseur pendant que tu le bouges
    if (typeof s.volume === 'number' && Date.now() - volTouchedAt > 1500) {
      vol.value = Math.round(s.volume * 100);
      paintVol(vol.value);
    }
  });

  // Espace = lecture/pause, flèches = précédent/suivant, haut/bas = volume, Échap = fermer.
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); send('toggle'); }
    if (e.key === 'ArrowLeft') send('previoustrack');
    if (e.key === 'ArrowRight') send('nexttrack');
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      e.preventDefault();
      vol.value = Math.max(0, Math.min(100, +vol.value + (e.key === 'ArrowUp' ? 5 : -5)));
      vol.dispatchEvent(new Event('input'));
    }
    if (e.key === 'Escape') send('close');
  });
</script>
</body>
</html>
